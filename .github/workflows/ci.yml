name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Fuzz packet parsers
        run: |
          go test ./pkg/protocol -run=^$ -fuzz=FuzzParseDataHeader -fuzztime=50000x
          go test ./pkg/protocol -run=^$ -fuzz=FuzzParseHandshake -fuzztime=50000x
          go test ./pkg/protocol -run=^$ -fuzz=FuzzParseControl -fuzztime=50000x

      - name: Build
        run: go build ./...

  integration:
    name: Linux namespace integration
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install network test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping kmod

      - name: Run privileged namespace suite
        run: |
          chmod +x scripts/run_integration_test.sh
          sudo env "PATH=$PATH" ./scripts/run_integration_test.sh
