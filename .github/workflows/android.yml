name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taltun-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Store APK in repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p android/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android/apk/Taltun-Android-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f android/apk/Taltun-Android-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "android: publish debug APK [skip ci]"
            git push origin HEAD:main
          fi
