name: Prerelease

on:
  push:
    branches: [main]
    paths:
      - "RELEASE_CANDIDATE"

permissions:
  contents: write

jobs:
  publish:
    name: Publish v0.11.0-rc1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or retarget prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.11.0-rc1
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Replacing existing $TAG so it targets $GITHUB_SHA"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Taltun v0.11.0-rc1 — Security Hardening" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
